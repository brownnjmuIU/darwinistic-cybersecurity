# Render blueprint. In Render: New +  ->  Blueprint  ->  pick your repo.
# Render reads this file and provisions the service automatically.
services:
  - type: web
    name: darwinistic-sim
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      # Leave these unset to use the deterministic rule-based fallback.
      # Set both to wire in a real OpenAI-compatible model.
      - key: LLM_PROVIDER_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
